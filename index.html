<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чат на WebSocket - Комната {{ room_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <h1 class="text-2xl font-bold mb-4">Чат на WebSocket - Комната {{ room_id }}</h1>

    <!-- ✅ Скрытый элемент с данными -->
    <div id="room-data"
         data-room-id="{{ room_id }}"
         data-username="{{ username }}"
         data-user-id="{{ user_id }}"
         style="display:none;">
    </div>

    <div id="messages" class="flex flex-col h-96 overflow-y-auto border p-2 bg-white rounded-md mb-4"></div>

    <div class="flex gap-2">
        <input type="text" id="messageInput" class="flex-1 border p-2 rounded-md" placeholder="Введите сообщение...">
        <button onclick="sendMessage()" class="bg-blue-500 text-white px-4 py-2 rounded-md">Отправить</button>
    </div>

    <script src="/static/index.js"></script>
</body>
</html>
